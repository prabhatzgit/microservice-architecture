server:
  port: 8085
spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/users, /users/**

            - id: hotel-service
              uri: lb://hotel-service
              predicates:
                - Path=/hotels/**, /staffs/** # all the controller request mapping need to be configured here

            - id: rating-service
              uri: lb://rating-service
              predicates:
                - Path=/ratings/**

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
